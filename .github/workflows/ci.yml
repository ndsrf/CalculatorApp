name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint docs and OpenSpec 1:1 governance
        run: npm run lint:docs

      - name: Typecheck and build app
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

      - name: Run model-based state machine tests (fast-check)
        run: npm run test:model

      - name: Run calc-verify contract and integration tests
        run: npm run test:cli

      - name: Run Promptfoo evals
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run eval
