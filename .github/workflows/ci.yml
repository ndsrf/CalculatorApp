name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI (and any agent that triggers it) can read the repo but not push, comment or release.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check deterministic formatting (Prettier)
        run: npm run format:check

      - name: Lint docs and OpenSpec 1:1 governance
        run: npm run lint:docs

      - name: Lint architecture and dependency graph
        run: npm run lint:arch

      - name: Prune dead code and unused exports (knip)
        run: npm run lint:deadcode

      - name: Generate and verify Mermaid state chart
        run: npm run docs:state-chart && git diff --exit-code docs/state-chart.md

      - name: Typecheck and build app
        run: npm run build

      - name: Run unit tests (core logic, guardrails, pre-tool hook)
        run: npm run test:unit

      - name: Run model-based state machine tests (fast-check)
        run: npm run test:model

      - name: Run calc-verify contract and integration tests
        run: npm run test:cli

      - name: Run Playwright + fast-check UI fuzzing tests
        run: npm run test:fuzz

      # Offline stub by default. To run against real models, set repository *variables*
      # EVAL_PROVIDER_FRONTIER / EVAL_PROVIDER_LIGHTWEIGHT (and optionally EVAL_PROVIDER_JUDGE)
      # plus the matching API-key *secret* for your provider. See .env.example.
      - name: Run Promptfoo evals (deterministic, safety, cost/latency; llm-rubric when live)
        env:
          EVAL_PROVIDER_FRONTIER: ${{ vars.EVAL_PROVIDER_FRONTIER }}
          EVAL_PROVIDER_LIGHTWEIGHT: ${{ vars.EVAL_PROVIDER_LIGHTWEIGHT }}
          EVAL_PROVIDER_JUDGE: ${{ vars.EVAL_PROVIDER_JUDGE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: npm run eval

      - name: Upload verification evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: |
            traces/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
