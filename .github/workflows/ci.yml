name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI (and any agent that triggers it) can read the repo but not push, comment or release.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The prompt lint compares against the base commit.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # CI only: needs the network, and a new advisory can fail an unchanged commit.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check deterministic formatting (Prettier)
        run: npm run format:check

      - name: Lint docs and OpenSpec 1:1 governance
        run: npm run lint:docs

      - name: Lint prompt versions and golden cases
        env:
          PROMPT_BASE_REF: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: npm run lint:prompts

      - name: Verify vendored skills against skills-lock.json
        run: npm run lint:skills

      - name: Lint architecture and dependency graph
        run: npm run lint:arch

      - name: Prune dead code and unused exports (knip)
        run: npm run lint:deadcode

      - name: Generate and verify Mermaid state chart
        run: npm run docs:state-chart && git diff --exit-code docs/state-chart.md

      - name: Typecheck and build app
        run: npm run build

      - name: Run unit tests (core logic, Expression Translator, guardrails, hook, prompt and skill lints, test server)
        run: npm run test:unit

      - name: Run model-based state machine tests (fast-check)
        run: npm run test:model

      - name: Run calc-verify contract and integration tests
        run: npm run test:cli

      - name: Run UI vocabulary tests
        run: npm run test:ui

      - name: Run Playwright + fast-check UI fuzzing tests
        run: npm run test:fuzz

      # Offline stub by default. To evaluate a real model, set repository *variables* AI_BASE_URL and
      # AI_MODEL_LIGHTWEIGHT plus the *secret* AI_API_KEY. See .env.example.
      - name: Run Promptfoo evals on the real Expression Translator pipeline
        env:
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL_LIGHTWEIGHT: ${{ vars.AI_MODEL_LIGHTWEIGHT }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: npm run eval

      - name: Upload verification evidence on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-evidence
          path: |
            traces/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
