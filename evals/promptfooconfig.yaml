description: 'Expression Translator evals (real pipeline: prompt + model + repair loop + safe parser)'

# The question is the whole user message; the system prompt lives in prompts/expression-translator.md
# and is loaded by the app code itself, so evals and production can never drift apart.
prompts:
  - '{{question}}'

providers:
  - id: file://providers/expression-translator.mjs
    label: expression-translator

defaultTest:
  assert:
    - type: is-json
    - type: javascript
      value: file://assertions/check-translation.mjs
    - type: latency
      threshold: 10000

tests: file://golden-dataset.yaml
